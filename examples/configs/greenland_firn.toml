# Firn density and temperature profiles at the end of every month, 1950–2023, for the
# comparison with SUMup (parameterized surface energy balance).
#
#   julia --project -m Chion examples/configs/greenland_firn.toml --backend=gpu \
#       --output-dir=output/greenland_firn_parameterized
#
# The firn figures also show two variants of this file (run_paper_experiments.sh):
#   30 snow layers instead of 15:
#     … --output-dir=output/greenland_firn_parameterized_ntot30 --set model.Ntot=30
#   MAR surface fluxes and albedo prescribed (also shown in the figures):
#     … --output-dir=output/greenland_firn_prescribed --set forcing.surface_fluxes=prescribed --set model.albedo=prescribed

name = "greenland_firn"
backend = "gpu"
years = [1940, 2023]
output_dir = "../../output/greenland_firn"

[forcing]
path = "/p/projects/ou/labs/ai/Nils/MAR_daily/mar_daily/MARv3.14.3-10km-daily-ERA5-{year}.nc"
surface_fluxes = "parameterized"

[spinup]
type = "cycled"
years = [1940, 1969]
cycles = 5

[[output]]
file = "firn_profiles.nc"
variables = ["density_profile", "temperature_profile", "firn_air_content"]
frequency = "1 month"                # one snapshot at the end of every month
kind = "snapshot"
period = [1950, 2023]
depths = {start = 0.0, stop = 20.0, step = 0.5}   # density in 0.5 m bins, temperature at these depths
