# Greenland ice sheet, 1940–2026, forced by daily MAR v3.14.3 (10 km, ERA5).
# The surface energy fluxes and the albedo are prescribed from MAR (tests the snowpack alone).
#
#   julia --project -m Chion examples/configs/greenland_prescribed.toml --backend=gpu \
#       --output-dir=output/greenland_prescribed_steps_8
#
# The evaluation figures compare 1, 4, 8 (default) and 24 shortwave substeps per day:
#     … --output-dir=output/greenland_prescribed_steps_4 --set model.diurnal_shortwave_max_substeps=4

name = "greenland_prescribed"
backend = "gpu"
years = [1940, 2026]
output_dir = "../../output/greenland_prescribed"

[forcing]
path = "/p/projects/ou/labs/ai/Nils/MAR_daily/mar_daily/MARv3.14.3-10km-daily-ERA5-{year}.nc"
format = "mar"                       # ice mask MSK ≥ 50 %, constant 5 m/s wind, cell area AREA
surface_fluxes = "prescribed"        # MAR net shortwave, longwave down, turbulent fluxes and albedo

[forcing.files]                      # the raw 2026 file lacks fields; use the repaired copy
2026 = "/p/projects/ou/labs/ai/Nils/Chion.jl/output/mar_forcing/MARv3.14.3-10km-daily-ERA5-2026_chion_compatible.nc"

[model]                              # BESSIModel keywords; everything else stays at the defaults
type = "bessi"
albedo = "prescribed"

[spinup]
type = "cycled"                      # five cycles of the real years 1940–1969
years = [1940, 1969]
cycles = 5

[[output]]                           # monthly maps of the mass budget
file = "monthly.nc"
variables = "monthly"
frequency = "monthly"

[[output]]                           # ice-sheet totals per year (Gt)
file = "budget_yearly.csv"
variables = "budget"
frequency = "yearly"
aggregate = "area_sum"
