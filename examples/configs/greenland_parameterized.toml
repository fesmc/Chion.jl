# Greenland ice sheet, 1940–2026, forced by daily MAR v3.14.3 (10 km, ERA5).
# Chion computes the surface energy balance and the albedo itself (the calibrated defaults).
#
#   julia --project -m Chion examples/configs/greenland_parameterized.toml --backend=gpu

name = "greenland_parameterized"
backend = "gpu"
years = [1940, 2026]
output_dir = "../../output/greenland_parameterized"

[forcing]
path = "/p/projects/ou/labs/ai/Nils/MAR_daily/mar_daily/MARv3.14.3-10km-daily-ERA5-{year}.nc"
format = "mar"                       # ice mask MSK ≥ 50 %, constant 5 m/s wind, cell area AREA
surface_fluxes = "parameterized"     # use only temperature, humidity, precipitation and shortwave down

[forcing.files]                      # the raw 2026 file lacks fields; use the repaired copy
2026 = "/p/projects/ou/labs/ai/Nils/Chion.jl/output/mar_forcing/MARv3.14.3-10km-daily-ERA5-2026_chion_compatible.nc"

[model]                              # BESSIModel keywords; everything else stays at the defaults
type = "bessi"

[spinup]
type = "cycled"                      # five cycles of the real years 1940–1969
years = [1940, 1969]
cycles = 5

[[output]]                           # monthly maps of the mass budget
file = "monthly.nc"
variables = "monthly"
frequency = "monthly"

[[output]]                           # ice-sheet totals per year (Gt)
file = "budget_yearly.csv"
variables = "budget"
frequency = "yearly"
aggregate = "area_sum"
