# Antarctic ice sheet, 1979–2026, forced by daily MAR v3.14.3 (27.5 km, ERA5), with the surface
# energy balance computed by Chion with the Greenland parameters (the BESSIModel defaults).
# MAR has no daily data before 1979, so the spin-up repeats 1979 for 200 years.
#
#   julia --project -m Chion examples/configs/antarctica_parameterized.toml --backend=gpu

name = "antarctica_parameterized"
backend = "gpu"
years = [1979, 2026]
output_dir = "../../output/antarctica_parameterized"

[forcing]
path = "/p/projects/ou/labs/ai/Nils/MAR_daily/mar_daily_antarctica/MARv3.14.3-27.5km-daily-ERA5-{year}.nc"
format = "mar"
surface_fluxes = "parameterized"
# Files before 2025 lack the cell area; the grid is the same in every year.
area_file = "/p/projects/ou/labs/ai/Nils/MAR_daily/mar_daily_antarctica/MARv3.14.3-27.5km-daily-ERA5-2025.nc"

[model]                              # the BESSIModel defaults, as for Greenland
type = "bessi"
# The Antarctic calibration against MAR (output/antarctica_surface_calibration) instead:
#   lw_clear_sky_emissivity = 0.7314, lw_clear_sky_emissivity_temperature_slope = 0.003378,
#   lw_overcast_emissivity = 0.9877, lw_overcast_emissivity_temperature_slope = 0.004171,
#   lw_cloud_emissivity_exponent = 2.0, lw_night_cloud_fraction = 0.9,
#   semix_sensible_exchange_factor = 2.5, semix_stable_coefficient = 20.0,
#   semix_latent_exchange_factor = 3.0, alpha_dry = 0.87, alpha_wet = 0.82

[spinup]
type = "climatology"                 # 200 years of 1979, with the settings of [forcing]
path = "/p/projects/ou/labs/ai/Nils/MAR_daily/mar_daily_antarctica/MARv3.14.3-27.5km-daily-ERA5-1979.nc"
years = 200

[[output]]                           # monthly maps of the mass budget
file = "monthly.nc"
variables = "monthly"
frequency = "monthly"

[[output]]                           # ice-sheet totals per year (Gt)
file = "budget_yearly.csv"
variables = "budget"
frequency = "yearly"
aggregate = "area_sum"
