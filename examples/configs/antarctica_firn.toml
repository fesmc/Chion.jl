# Antarctic firn density and temperature profiles at the end of every month, 1979–2025, for
# the comparison with SUMup. The spin-up of 20 cycles of 1979–2008 (600 years) fills the firn column
# at low accumulation.
#
#   julia --project -m Chion examples/configs/antarctica_firn.toml --backend=gpu \
#       --output-dir=output/antarctica_firn_parameterized
#
#   MAR surface fluxes and albedo prescribed (also shown in the figures):
#     … --output-dir=output/antarctica_firn_prescribed --set forcing.surface_fluxes=prescribed --set model.albedo=prescribed
#
#   30 instead of 15 layers (resolves the deep firn; also shown in the figures):
#     … --output-dir=output/antarctica_firn_parameterized_ntot30 --set model.Ntot=30

name = "antarctica_firn"
backend = "gpu"
years = [1979, 2025]
output_dir = "../../output/antarctica_firn"

[forcing]
path = "/p/projects/ou/labs/ai/Nils/MAR_daily/mar_daily_antarctica/MARv3.14.3-27.5km-daily-ERA5-{year}.nc"
format = "mar"
surface_fluxes = "parameterized"
# Files before 2025 lack the cell area; the grid is the same in every year.
area_file = "/p/projects/ou/labs/ai/Nils/MAR_daily/mar_daily_antarctica/MARv3.14.3-27.5km-daily-ERA5-2025.nc"

[model]                              # the BESSIModel defaults, as for Greenland
type = "bessi"
# The Antarctic calibration against MAR (output/antarctica_surface_calibration) instead:
#   lw_clear_sky_emissivity = 0.7314, lw_clear_sky_emissivity_temperature_slope = 0.003378,
#   lw_overcast_emissivity = 0.9877, lw_overcast_emissivity_temperature_slope = 0.004171,
#   lw_cloud_emissivity_exponent = 2.0, lw_night_cloud_fraction = 0.9,
#   semix_sensible_exchange_factor = 2.5, semix_stable_coefficient = 20.0,
#   semix_latent_exchange_factor = 3.0, alpha_dry = 0.87, alpha_wet = 0.82

[spinup]
type = "cycled"
years = [1979, 2008]
cycles = 20

[[output]]
file = "firn_profiles.nc"
variables = ["density_profile", "temperature_profile", "firn_air_content"]
frequency = "1 month"                # one snapshot at the end of every month
kind = "snapshot"
period = [1979, 2025]
depths = {start = 0.0, stop = 20.0, step = 0.5}
